[project]
name = "immortility"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.162.5", "starlette==1.3.1", "uvicorn==0.34.2", "httpx==0.28.1",
  "pydantic==2.11.4", "pydantic-settings==2.9.1", "jsonschema==4.23.0"
]

[project.optional-dependencies]
voice = ["faster-whisper==1.2.1", "av==18.0.0", "piper-tts==1.8.0", "sounddevice==0.5.6", "numpy==2.5.4; python_version >= '3.12'"]

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-asyncio==1.5.0", "ruff==0.11.10", "mypy==1.15.0", "types-jsonschema==4.23.0.20250516", "pip-audit==2.9.0"]

[tool.pytest.ini_options]
pythonpath = ["services/broker/src", "services/tts/src"]
testpaths = ["services/broker/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.13"
strict = true
files = ["services/broker/src"]

[[tool.mypy.overrides]]
module = ["faster_whisper.*", "ctranslate2.*", "sounddevice.*", "immortility_tts.*", "pedalboard.*", "torch.*", "spacy.*", "kokoro.*"]
ignore_missing_imports = true

