# Policy spec only. The application MUST implement and test enforcement.
default: deny
profiles:
  observer:
    allow: [chat, read_permitted_files, metadata_active_window, local_clock, local_arithmetic, local_resources, reveal_authorized_path]
    require_approval: [capture_screen, upload_content_to_cloud, move_pointer]
  assisted:
    allow: [chat, read_permitted_files, browse_public_web, write_approved_workspace, local_clock, local_arithmetic, local_resources, reveal_authorized_path]
    require_approval: [capture_screen, upload_content_to_cloud, move_pointer, run_code, destructive_file_change, submit_form, send_message, deploy]
  autonomous_scoped:
    allow: [chat, read_permitted_files, browse_public_web, scoped_approved_workflows]
    require_approval: [capture_screen, upload_content_to_cloud, new_domain, new_workspace, destructive_file_change, credentials, purchase, financial_transfer, external_message]
global:
  deny_without_fresh_approval: [purchase, transfer_money, install_system_service, disable_security, arbitrary_admin_command, secrets_export, public_post]
  hard_kill_switch: true
  log_approvals_without_secret_values: true
  protect_system_paths: true
  follow_symlinks: false
  remote_access: disabled
